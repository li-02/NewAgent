# ===== 主配置 =====

# 时间窗口：只保留发布时间在最近 N 小时内的条目
# （比 24 稍宽，避免时区差导致漏稿；普通无日期条目不收录）
# page_watch/article_index 的有证据变更按首次检测时间入窗，成稿明确不等同于发布时间。
time_window_hours: 26

# 最终草稿最多收录的新闻条数
top_n: 12

# 前 N 条（按排序结果）在稿中留下截图占位符
screenshot_count: 5

# 单条正文提取的最大字符数（喂给 LLM 的长度上限）
max_text_chars: 2500

# LLM 成稿配置（OpenAI 兼容接口，智谱/DeepSeek/OpenAI 等均可）
# enabled: auto     = 检测到 api key 就启用，否则退化为列表版
# enabled: false    = 强制列表版
# key 建议放环境变量 LLM_API_KEY，不要写进本文件
# max_retries: 网络瞬断或服务端 429/5xx 时的重试次数（退避 5s/15s/30s，默认 2）
llm:
  enabled: auto
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash-vision-exp
  temperature: 0.7
  max_retries: 2

# 个人排序偏好：命中后会在排序中加分、降权或屏蔽
preferences:
  # 命中任一关键词的条目优先进入日报，优先级高于普通主题排序。
  # ⚠️ 这里是 OpenAI 长期霸屏的直接原因：priority_keywords 命中一次即 +100 分，
  #    足以压过全部主题权重。此前 18 条成稿里 11 条以 OpenAI 为主角（61%），
  #    账号因此被算法打上「OpenAI 动态」标签，泛科技读者留不住。
  #    建议只留 1~2 个真正想长期跟踪的主体，或整体清空。
  priority_keywords:
    - openai
    - anthropic
    - claude
    - gpt-6
    - opus 5.5
  boost_keywords: []
  downrank_keywords: []
  block_keywords: []

# 跨天标题判重：拦截「同一事件、不同媒体、不同 URL」的重复报道（单位：天，0=关闭）
# 靠 url_hash 抓不到这类重复（URL 不同），会导致同一件事连续两三天出现在日报里，
# 读者刷到重复内容就会取关，是掉粉主因。
cross_day_dedup_days: 7

output:
  dir: output
  filename: "科技日报-{date}.md"

# SQLite：记录已见条目，用于跨天去重
db_path: data/news.db
