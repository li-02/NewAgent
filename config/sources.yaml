    category: dev
    weight: 2

  - name: Ollama Releases
    type: rss
    url: https://github.com/ollama/ollama/releases.atom
    category: dev
    weight: 2

  - name: MCP Python SDK Releases
    type: rss
    url: https://github.com/modelcontextprotocol/python-sdk/releases.atom
