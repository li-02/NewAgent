    weight: 3

  - name: OpenCode Releases
    type: rss
    url: https://github.com/anomalyco/opencode/releases.atom
    category: dev
    weight: 3

  # 主流 AI 开发框架发布；不接入高频逐构建/nightly 源。
  - name: LangChain Releases
    type: rss
    url: https://github.com/langchain-ai/langchain/releases.atom
    category: dev
    weight: 2

  - name: LlamaIndex Releases
    type: rss
    url: https://github.com/run-llama/llama_index/releases.atom
    category: dev
