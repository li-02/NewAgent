  - name: inclusionAI Hugging Face
    type: huggingface
    url: https://huggingface.co/inclusionAI
    category: paper
    weight: 3

  - name: inclusionAI GitHub
    type: github_org
    url: https://github.com/inclusionAI
    category: paper
    weight: 3

  - name: inclusionAI 模型服务目录
    type: model_catalog
    url: https://openrouter.ai/api/v1/models
    code: inclusionai/
    weight: 2

  # 社区消息是线索，成稿保留用户报告口径，不视为官方确认。
  - name: Reddit ClaudeAI
    type: rss
    url: https://www.reddit.com/r/ClaudeAI/new/.rss
    category: community
    weight: 1
    enabled: false

  - name: Reddit LocalLLaMA
    type: rss
    url: https://www.reddit.com/r/LocalLLaMA/new/.rss
    category: community
    weight: 1
    enabled: false

  - name: Reddit OpenCode
    type: rss
    url: https://www.reddit.com/r/opencode/new/.rss
    category: community
    weight: 1
