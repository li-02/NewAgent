    category: product
    weight: 3

  - name: Codex 桌面端更新
    type: page_watch
    url: https://developers.openai.com/codex/changelog/
    category: dev
    weight: 3

  - name: Codex GitHub Releases
    type: rss
    url: https://github.com/openai/codex/releases.atom
    category: dev
    weight: 3

  - name: Claude Max 额度说明
