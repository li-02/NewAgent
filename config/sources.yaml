# ===== 数据源配置 =====
# type: rss（通用 RSS/Atom）| hackernews（HN 官方 API）| changelog | html_updates
# weight: 官方源权重，排序时作为加分项
# category: news（默认）| paper（归入"论文与开源"小节）
# 加新源：追加一个条目即可，不用改代码

sources:
  - name: OpenAI News
    type: rss
    url: https://openai.com/news/rss.xml
    weight: 3

  - name: Google DeepMind Blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    weight: 3

  - name: TechCrunch AI
    type: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    weight: 1

  - name: The Verge AI
    type: rss
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    weight: 1

  - name: Hacker News
    type: hackernews
    min_score: 150
    weight: 1
    category: community
    require_ai: true   # HN 是综合热榜，只保留 AI 相关条目

  - name: NVIDIA Blog
    type: rss
    url: https://blogs.nvidia.com/feed/
    weight: 2

  - name: Microsoft Research
    type: rss
    url: https://www.microsoft.com/en-us/research/feed/
    weight: 2

  - name: VentureBeat AI
    type: rss
    url: https://venturebeat.com/category/ai/feed/
    weight: 1

  # 补充高频 AI 资讯与技术媒体；媒体源保持低权重，避免压过官方公告。
  - name: Ars Technica AI
    type: rss
    url: https://arstechnica.com/ai/feed/
    weight: 1

  - name: The Decoder
    type: rss
    url: https://the-decoder.com/feed/
    require_ai: true
    weight: 1

  - name: InfoQ AI/ML
    type: rss
    url: https://feed.infoq.com/ai-ml-data-eng/
    require_ai: true
    weight: 1
    category: dev

  - name: 量子位
    type: rss
    url: https://www.qbitai.com/feed
    weight: 1

  # 官方研究、开源社区与 AI 基础设施博客。
  - name: Hugging Face Blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    weight: 2

  - name: Google Research
    type: rss
    url: https://research.google/blog/rss/
    weight: 3
    category: paper

  - name: Apple ML Research
    type: rss
    url: https://machinelearning.apple.com/rss.xml
    weight: 3
    category: paper

  - name: AWS AI Blog
    type: rss
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    weight: 2
    category: dev

  - name: Cloudflare AI
    type: rss
    url: https://blog.cloudflare.com/tag/ai/rss/
    weight: 2
    category: dev

  - name: GitHub Changelog AI
    type: rss
    url: https://github.blog/changelog/feed/
    require_ai: true
    weight: 2
    category: dev

  - name: Claude Code
    type: changelog
    format: markdown
    url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    link_base: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
    item_limit: 5
    weight: 3
    category: dev

  - name: 智谱 AI
    type: html_updates
    site: zhipu
    url: https://docs.bigmodel.cn/cn/update/new-releases
    weight: 3

  - name: 阿里千问
    type: html_updates
    site: qwen
    url: https://qwen.ai/news
    code: news.news-list
    weight: 3

  - name: 腾讯 WorkBuddy
    type: html_updates
    site: workbuddy
    url: https://www.workbuddy.cn/docs/workbuddy/Changelog
    weight: 3
    category: dev

  - name: 阿里 Qoder
    type: html_updates
    site: qoder
    url: https://docs.qoder.com/zh/release-notes/qoder
    weight: 3
    category: dev

  - name: Kimi
    type: html_updates
    site: moonshot
    url: https://www.moonshot.cn/
    weight: 3

  - name: DeepSeek News
    type: html_updates
    site: deepseek
    url: https://deepseek.com/en/news/
    weight: 3

  - name: DeepSeek API
    type: html_updates
    site: deepseek
    url: https://api-docs.deepseek.com/updates/
    weight: 3
    category: dev

  # 官方产品与研究发布；产品博客不能由研究博客替代。
  - name: Google 产品博客
    type: rss
    url: https://blog.google/rss/
    require_ai: true
    weight: 3

  - name: Microsoft AI
    type: article_index
    url: https://microsoft.ai/news/
    link_pattern: '^https://microsoft\.ai/news/[^/?]+/?$'
    weight: 3

  - name: Microsoft Foundry
    type: rss
    url: https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=azure-ai-foundry-blog
    weight: 3

  - name: Meta AI Research
    type: article_index
    url: https://research.meta.ai/blog/
    link_pattern: '^https://research\.meta\.ai/blog/[^/?]+/?$'
    weight: 3

  # 首次抓取只建立正文基线，之后的变化使用“首次检测时间”。
  - name: OpenAI 模型与额度说明
    type: page_watch
    url: https://help.openai.com/en/articles/20001354
    category: product
    weight: 3

  - name: OpenAI Business 模型与额度
